name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
      checks: write
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # No database needed: this compares the Drizzle schema against the tables
      # the committed migrations create, so a column added to one and not the
      # other fails here rather than at the next db:generate.
      - name: Migration coverage
        run: pnpm db:check

      - name: Build
        run: pnpm build

      - name: Unit tests and coverage
        run: pnpm test --coverage

      - name: Typecheck
        run: pnpm typecheck

  # The money suites need a real database, so they cannot live in the job above.
  # Without this job they skip on every machine and in CI, and a broken balance
  # or a withdrawn replay guard would stay green indefinitely.
  e2e:
    name: E2E (money paths)
    runs-on: ubuntu-latest
    services:
      postgres:
        # Same major as compose.yaml: CI would otherwise check the schema
        # against a different server than the one developers run on.
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nomidat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Named `_test` because the suites refuse any other database: they insert
      # and delete rows, and a mistaken run against real data is not recoverable.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nomidat_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nomidat_test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Migrate
        run: pnpm --filter @nomidat/db db:migrate

      # Every suite under apps/api/test. TEST_DATABASE_URL is set above, so none
      # of them skip; the unit job runs the same command with it unset.
      - name: End-to-end tests
        run: pnpm vitest run apps/api/test

      - uses: fallow-rs/fallow@v3
        id: fallow
        with:
          # audit = changed-files quality gate (verdict); health baseline for
          # known no-coverage findings lives in .fallowrc.json -> .fallow/health-baseline.json
          command: audit
          # human prints file:line findings in the job log; SARIF is still written for upload
          format: human
          fail-on-issues: true
          auto-changed-since: true
          comment: true
          annotations: true

      - name: Print fallow JSON summary
        if: failure() && hashFiles('fallow-results.json') != ''
        run: |
          node <<'EOF'
          const fs = require("fs");
          const report = JSON.parse(fs.readFileSync("fallow-results.json", "utf8"));
          const check = report.check ?? report;
          const exports = check.unused_exports ?? [];
          const types = check.unused_types ?? [];
          const files = check.unused_files ?? [];
          const deps = [
            ...(check.unused_dependencies ?? []),
            ...(check.unused_dev_dependencies ?? []),
          ];
          const members = check.unused_class_members ?? [];
          const cycles = check.circular_dependencies ?? [];
          const health = report.health?.findings ?? [];

          const lines = [];
          for (const i of exports) lines.push(`unused-export  ${i.path}:${i.line}  ${i.export_name}`);
          for (const i of types) lines.push(`unused-type    ${i.path}:${i.line}  ${i.export_name}`);
          for (const i of files) lines.push(`unused-file    ${i.path}`);
          for (const i of deps) lines.push(`unused-dep     ${i.name ?? i}  (${i.workspace ?? i.path ?? ""})`);
          for (const i of members) lines.push(`unused-member  ${i.path}:${i.line}  ${i.member_name ?? i.name}`);
          for (const i of cycles) lines.push(`circular       ${i.path ?? JSON.stringify(i)}`);
          for (const i of health) lines.push(`health         ${i.path}:${i.line}  ${i.function_name ?? i.name}  CRAP=${i.crap ?? "?"}`);

          if (!lines.length) {
            console.log("No structured findings in fallow-results.json; see the Fallow step log above.");
            process.exit(0);
          }
          console.log(`Fallow findings (${lines.length}):\n`);
          console.log(lines.join("\n"));
          EOF

      - uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('fallow-results.sarif') != ''
        with:
          sarif_file: fallow-results.sarif
